  <script>
    // =========================================================================
    // DropDeck Core State, Currencies, Zero-Tax Rules & IndexedDB File Storage
    // =========================================================================

    const CURRENCIES = {
      USD: { symbol: '$', name: 'US Dollar', decimals: 2, rateFromUSD: 1.0 },
      INR: { symbol: '₹', name: 'Indian Rupee', decimals: 2, rateFromUSD: 93.10 },
      EUR: { symbol: '€', name: 'Euro', decimals: 2, rateFromUSD: 0.9103 },
      JPY: { symbol: '¥', name: 'Japanese Yen', decimals: 0, rateFromUSD: 158.55 },
      GBP: { symbol: '£', name: 'British Pound', decimals: 2, rateFromUSD: 0.7641 },
      CNY: { symbol: '¥', name: 'Chinese Yuan (Onshore)', decimals: 2, rateFromUSD: 6.6805 },
      CNH: { symbol: '¥', name: 'Chinese Yuan (Offshore)', decimals: 2, rateFromUSD: 6.6850 },
      AUD: { symbol: 'A$', name: 'Australian Dollar', decimals: 2, rateFromUSD: 1.5008 },
      CAD: { symbol: 'C$', name: 'Canadian Dollar', decimals: 2, rateFromUSD: 1.4344 },
      CHF: { symbol: 'CHF ', name: 'Swiss Franc', decimals: 2, rateFromUSD: 0.8396 },
      HKD: { symbol: 'HK$', name: 'Hong Kong Dollar', decimals: 2, rateFromUSD: 7.7800 },
      SGD: { symbol: 'S$', name: 'Singapore Dollar', decimals: 2, rateFromUSD: 1.2890 },
    };

    const TAX_JURISDICTIONS = [
      { id: 'exempt_global', name: 'Zero-Tax Digital Goods Rule (Personal / Small Creator)', rate: 0, supported: true, note: '0% tax applied under small-creator / direct digital export thresholds where supported by local rules.' },
      { id: 'hk_sg_exempt', name: 'Hong Kong / Non-Registered Digital Export', rate: 0, supported: true, note: '0% VAT/GST applied for qualifying non-registered digital exports.' },
      { id: 'us_exempt_state', name: 'US Tax-Exempt / Zero Sales Tax State (DE, OR, MT, NH, AK)', rate: 0, supported: true, note: '0% state sales tax applied in non-sales-tax jurisdictions or exempt digital categories.' },
      { id: 'b2b_reverse', name: 'B2B Reverse Charge (Tax-Registered Buyer)', rate: 0, supported: true, note: '0% charged at checkout; buyer accounts for applicable local tax under reverse-charge rules.' },
      { id: 'standard_custom', name: 'Custom Local Tax Rate (If Required by Law)', rate: 0, supported: false, note: 'Use a custom tax percentage when your jurisdiction requires tax collection.' },
    ];

    const CATEGORIES = ['Files', '3D Assets', 'Games', 'Apps'];

    const STORAGE_KEY = 'dropdeck_state_v1';

    const DEFAULT_STATE = {
      accounts: [], // Strictly empty on start — no demo/test/useless accounts
      activeAccountId: null,
      products: [], // Strictly empty on start — no demo/test/useless listings
      orders: [],
      cart: [],
      reviews: [], // { id, productId, buyerId, buyerName, rating, comment, createdAt }
      settings: {
        displayCurrency: 'USD',
        darkMode: false,
        taxRuleId: 'exempt_global',
        zeroTaxEnabled: true,
        customTaxRate: 0,
        customRates: {},
        gatewayMode: 'local_direct',
        gatewayPublicKey: '',
        gatewayWebhookUrl: '',
        catalogUrl: './catalog.json',
      },
      ui: {
        view: 'marketplace',
        category: 'all',
        search: '',
        sort: 'newest',
        priceFilter: 'all',
        minPrice: '',
        maxPrice: '',
        taxFreeOnly: false,
      },
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) },
          ui: { ...DEFAULT_STATE.ui, ...(parsed.ui || {}) },
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Storage warning: could not save full state to localStorage.', 'error');
      }
    }

    // IndexedDB for storing real uploaded files (Blobs)
    const DB_NAME = 'DropDeckFilesDB';
    const DB_VERSION = 1;
    const STORE_FILES = 'files';

    function openFilesDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_FILES)) {
            db.createObjectStore(STORE_FILES, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFileBlob(id, file) {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_FILES, 'readwrite');
        tx.objectStore(STORE_FILES).put({
          id,
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          blob: file,
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getFileRecord(id) {
      const db = await openFilesDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_FILES, 'readonly');
        const req = tx.objectStore(STORE_FILES).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteFileRecord(id) {
      try {
        const db = await openFilesDB();
        const tx = db.transaction(STORE_FILES, 'readwrite');
        tx.objectStore(STORE_FILES).delete(id);
      } catch (e) {}
    }

    // =========================================================================
    // Currency & Formatting Helpers
    // =========================================================================

    function getRate(code) {
      if (state.settings.customRates && typeof state.settings.customRates[code] === 'number' && state.settings.customRates[code] > 0) {
        return state.settings.customRates[code];
      }
      return CURRENCIES[code] ? CURRENCIES[code].rateFromUSD : 1;
    }

    function convertAmount(amount, fromCode, toCode) {
      const num = Number(amount) || 0;
      if (fromCode === toCode) return num;
      const fromRate = getRate(fromCode);
      const toRate = getRate(toCode);
      const usd = num / fromRate;
      return usd * toRate;
    }

    function formatMoney(amount, code = state.settings.displayCurrency) {
      const cur = CURRENCIES[code] || CURRENCIES.USD;
      const num = Number(amount) || 0;
      const formatted = num.toLocaleString(undefined, {
        minimumFractionDigits: cur.decimals,
        maximumFractionDigits: cur.decimals,
      });
      return `${cur.symbol}${formatted}`;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return 'External / Link';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let val = bytes;
      while (val >= 1024 && i < units.length - 1) {
        val /= 1024;
        i++;
      }
      return `${val.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getActiveAccount() {
      return state.accounts.find((a) => a.id === state.activeAccountId) || null;
    }

    function canBuy(acc) {
      return acc && (acc.role === 'Buyer' || acc.role === 'User');
    }

    function canSell(acc) {
      return acc && (acc.role === 'Seller' || acc.role === 'User');
    }

    function getTaxRatePercent() {
      if (state.settings.zeroTaxEnabled) return 0;
      const rule = TAX_JURISDICTIONS.find((r) => r.id === state.settings.taxRuleId);
      if (rule && rule.supported) return 0;
      return Math.max(0, Math.min(50, Number(state.settings.customTaxRate) || 0));
    }

    function getProductRating(productId) {
      const list = state.reviews.filter((r) => r.productId === productId);
      if (!list.length) return { avg: 0, count: 0 };
      const sum = list.reduce((acc, r) => acc + r.rating, 0);
      return { avg: sum / list.length, count: list.length };
    }

    function hasPurchased(accountId, productId) {
      if (!accountId) return false;
      return state.orders.some((o) => o.buyerId === accountId && o.items.some((it) => it.productId === productId));
    }

    // =========================================================================
    // Toast & Modal Utilities
    // =========================================================================

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between gap-3 transition-all ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

      document.getElementById('modal-body').innerHTML = bodyHtml;
      root.classList.remove('hidden');
      root.classList.add('flex');

      const root = document.getElementById('modal-root');
      root.classList.add('hidden');

        e.preventDefault();
        const fd = new FormData(e.target);
        const fileInput = document.getElementById('pub-file-input');
        const thumbInput = document.getElementById('pub-thumb-input');

        const selectedFile = fileInput.files && fileInput.files[0];
        const selectedThumb = thumbInput.files && thumbInput.files[0];
        const externalUrl = fd.get('externalUrl').trim();

        if (!existing && !selectedFile && !externalUrl) {
          showToast('Please attach a real file or provide an external download URL.', 'error');
          return;
        }

        const productId = existing ? existing.id : uid('prod');
        let fileId = existing?.fileId || null;
        let fileName = existing?.fileName || '';
        let fileSize = existing?.fileSize || 0;

        if (selectedFile) {
          fileId = uid('file');
          try {
            await saveFileBlob(fileId, selectedFile);
            fileName = selectedFile.name;
            fileSize = selectedFile.size;
          } catch (err) {
            showToast('Could not store file in browser IndexedDB.', 'error');
            return;
          }
        }

        let thumbnail = existing?.thumbnail || '';
        if (selectedThumb) {
          thumbnail = await readFileAsDataUrl(selectedThumb);
        }

        const productObj = {
          id: productId,
          sellerId: acc.id,
          sellerName: acc.name,
          title: fd.get('title').trim(),
          category: fd.get('category'),
          format: fd.get('format').trim(),
          price: Math.max(0, Number(fd.get('price')) || 0),
          currency: fd.get('currency'),
          description: fd.get('description').trim(),
          license: fd.get('license'),
          tags: fd
            .get('tags')
            .split(',')
            .map((t) => t.trim())
            .filter(Boolean),
          fileId,
          fileName,
          fileSize,
          externalUrl,
          dodoPaymentUrl: (fd.get('dodoPaymentUrl') || '').trim(),
          thumbnail,
          taxExempt: fd.get('taxExempt') === 'on',
          downloads: existing ? existing.downloads : 0,
          createdAt: existing ? existing.createdAt : new Date().toISOString(),
        };

        if (existing) {
          const idx = state.products.findIndex((p) => p.id === existing.id);
          if (idx !== -1) state.products[idx] = productObj;
          showToast('Product updated.', 'success');
        } else {
          state.products.unshift(productObj);
          showToast(`"${productObj.title}" is now live on DropDeck!`, 'success');
        }

        saveState();
        closeModal();
        renderAll();
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    async function triggerProductDownload(productId) {
      const p = state.products.find((x) => x.id === productId);
      if (!p) return;

      if (p.fileId) {
        try {
          const rec = await getFileRecord(p.fileId);
          if (rec && rec.blob) {
            const url = URL.createObjectURL(rec.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = rec.name || p.fileName || `${p.title}.bin`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            p.downloads += 1;
            saveState();
            renderAll();
            showToast(`Downloading ${a.download}...`, 'success');
            return;
          }
        } catch (err) {}
      }

      if (p.externalUrl) {
        window.open(p.externalUrl, '_blank', 'noopener,noreferrer');
        p.downloads += 1;
        saveState();
        renderAll();
        showToast('Opened external download link.', 'success');
        return;
      }

      showToast('No downloadable file found for this listing.', 'error');
    }

    function addToCart(productId, silent = false) {
      const acc = getActiveAccount();
      const p = state.products.find((x) => x.id === productId);
      if (!p) return;
      if (acc && acc.id === p.sellerId) {
        showToast('You are the seller of this product.', 'info');
        return;
      }
      if (acc && hasPurchased(acc.id, p.id)) {
        showToast('You already own this product! Check My Library.', 'info');
        return;
      }
      if (!state.cart.includes(productId)) {
        state.cart.push(productId);
        saveState();
        renderTopAndSidebar();
        if (!silent) showToast(`Added "${p.title}" to cart.`, 'success');
      }
    }

    function openCartDrawer() {
      document.getElementById('cart-drawer-root').classList.remove('hidden');
      renderCartDrawer();
    }

    function closeCartDrawer() {
      document.getElementById('cart-drawer-root').classList.add('hidden');
    }

    function renderCartDrawer() {
      const body = document.getElementById('cart-drawer-body');
      const dispCur = state.settings.displayCurrency;
      const items = state.cart.map((id) => state.products.find((p) => p.id === id)).filter(Boolean);

      if (!items.length) {
        body.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center py-12">
            <div class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-3">
              <i data-lucide="shopping-cart" class="w-7 h-7"></i>
            </div>
            <p class="font-semibold text-slate-700 dark:text-slate-200">Your cart is empty</p>
            <p class="text-xs text-slate-400 mt-1">Browse Files, 3D Assets, Games, or Apps to add items.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let subtotal = 0;
      let taxableSubtotal = 0;
      items.forEach((p) => {
        const val = convertAmount(p.price, p.currency, dispCur);
        subtotal += val;
        if (!p.taxExempt) taxableSubtotal += val;
      });

      const taxPct = getTaxRatePercent();
      const taxAmount = (taxableSubtotal * taxPct) / 100;
      const total = subtotal + taxAmount;
      const acc = getActiveAccount();

      body.innerHTML = `
        <div class="space-y-4">
          <div class="space-y-2.5">
            ${items
              .map((p) => {
                const priceDisp = convertAmount(p.price, p.currency, dispCur);
                return `
                  <div class="flex items-center justify-between gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                    <div class="min-w-0">
                      <p class="text-sm font-semibold truncate">${escapeHtml(p.title)}</p>
                      <p class="text-xs text-slate-500">${escapeHtml(p.category)} • ${p.taxExempt ? '0% Tax Eligible' : 'Standard'}</p>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                      <span class="text-sm font-bold">${p.price === 0 ? 'Free' : formatMoney(priceDisp, dispCur)}</span>
                      <button data-remove-cart="${p.id}" class="p-1 text-slate-400 hover:text-rose-500" aria-label="Remove item">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>

          <!-- Tax Breakdown -->
          <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 space-y-2 text-sm">
            <div class="flex justify-between text-slate-600 dark:text-slate-300">
              <span>Subtotal</span>
              <span>${formatMoney(subtotal, dispCur)}</span>
            </div>
            <div class="flex justify-between text-emerald-600 dark:text-emerald-400 font-medium">
              <span>Tax (${taxPct}%)</span>
              <span>${formatMoney(taxAmount, dispCur)}</span>
            </div>
            <div class="pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-between font-bold text-base">
              <span>Total (${dispCur})</span>
              <span>${formatMoney(total, dispCur)}</span>
            </div>
            <p class="text-[11px] text-slate-500 pt-1">
              ${taxPct === 0 ? 'Zero-tax rule active where supported by regional digital goods regulations.' : 'Custom regional tax rate applied from Settings.'}
            </p>
          </div>

          ${
            !acc
              ? `<button id="cart-signin-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Open Buyer / User Account to Checkout</button>`
              : !canBuy(acc)
              ? `<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 text-xs">
                  Seller-only accounts cannot purchase. Switch to a Buyer or User account to checkout.
                </div>`
              : `
                <form id="checkout-form" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Payment Method</label>
                    <select name="paymentMethod" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                      <option value="Card / UPI / PayPal">Card / UPI / International Pay</option>
                      <option value="DropDeck Wallet">DropDeck Wallet (${formatMoney(convertAmount(acc.walletUSD, 'USD', dispCur), dispCur)} available)</option>
                    </select>
                  </div>
                  <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition-colors">
                    ${total === 0 ? 'Complete Free Download' : `Pay ${formatMoney(total, dispCur)} & Unlock Files`}
                  </button>
                </form>
              `
          }
        </div>
      `;

      lucide.createIcons();

      body.querySelectorAll('[data-remove-cart]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.cart = state.cart.filter((id) => id !== btn.dataset.removeCart);
          saveState();
          renderTopAndSidebar();
          renderCartDrawer();
        });
      });

      const signInBtn = document.getElementById('cart-signin-btn');
      if (signInBtn) {
        signInBtn.addEventListener('click', () => {
          closeCartDrawer();
          openAccountModal('Buyer');
        });
      }

      const checkoutForm = document.getElementById('checkout-form');
      if (checkoutForm) {
        checkoutForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const method = new FormData(e.target).get('paymentMethod');
          const totalUSD = convertAmount(total, dispCur, 'USD');

          if (method === 'DropDeck Wallet' && acc.walletUSD < totalUSD) {
            showToast('Insufficient wallet balance. Choose Card/UPI or add funds in Wallet.', 'error');
            return;
          }

          if (method === 'DropDeck Wallet') {
            acc.walletUSD -= totalUSD;
          }

          items.forEach((p) => {
            const itemUSD = convertAmount(p.price, p.currency, 'USD');
            const seller = state.accounts.find((a) => a.id === p.sellerId);
            if (seller) {
              seller.walletUSD = (seller.walletUSD || 0) + itemUSD;
            }
          });

          const order = {
            id: uid('ORD'),
            buyerId: acc.id,
            buyerName: acc.name,
            currency: dispCur,
            subtotal,
            taxAmount,
            total,
            taxPercent: taxPct,
            paymentMethod: method,
            items: items.map((p) => ({
              productId: p.id,
              title: p.title,
              category: p.category,
              price: convertAmount(p.price, p.currency, dispCur),
            })),
            createdAt: new Date().toISOString(),
          };

          state.orders.unshift(order);
          state.cart = [];
          saveState();
          closeCartDrawer();
          state.ui.view = 'library';
          renderAll();
          showToast(`Order ${order.id} complete! Your files are unlocked in My Library.`, 'success');
        });
      }
    }

    function renderMarketplace(container) {
      const dispCur = state.settings.displayCurrency;
      const q = state.ui.search.trim().toLowerCase();

      let list = state.products.filter((p) => {
        if (state.ui.category !== 'all' && p.category !== state.ui.category) return false;
        if (state.ui.taxFreeOnly && !p.taxExempt) return false;
        const priceDisp = convertAmount(p.price, p.currency, dispCur);
        if (state.ui.priceFilter === 'free' && p.price > 0) return false;
        if (state.ui.priceFilter === 'paid' && p.price === 0) return false;
        if (state.ui.priceFilter === 'range') {
          const min = state.ui.minPrice !== '' ? Number(state.ui.minPrice) : 0;
          const max = state.ui.maxPrice !== '' ? Number(state.ui.maxPrice) : Infinity;
          if (priceDisp < min || priceDisp > max) return false;
        }
        if (q) {
          const hay = `${p.title} ${p.description} ${p.format} ${p.sellerName} ${p.tags.join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;

        if (state.ui.sort === 'price_asc') {

        if (state.ui.sort === 'rating') return getProductRating(b.id).avg - getProductRating(a.id).avg;
        return new Date(b.createdAt) - new Date(a.createdAt);

        renderMainView();

              p.thumbnail
                ? `<img src="${p.thumbnail}" alt="${escapeHtml(p.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />`
                : `<div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br ${categoryGradient(p.category)} text-white">

                  <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </div>
        </article>

      });

        btn.addEventListener('click', async () => {
          const target = state.products.find((p) => p.id === btn.dataset.delProd);

          state.products = state.products.filter((p) => p.id !== btn.dataset.delProd);

    function renderWalletAndOrders(container) {

        return;
      }

      const balDisp = convertAmount(acc.walletUSD, 'USD', dispCur);
      const myOrders = state.orders.filter((o) => o.buyerId === acc.id);

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Wallet & Orders</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Manage funds, seller payouts, and transaction receipts.</p>

              </div>
            </div>

            <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-sm mb-1">Zero-Tax Compliance Summary</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                  DropDeck applies <strong>${getTaxRatePercent()}% tax</strong> based on your active jurisdiction rule in Settings. All receipts record exact subtotal, tax, and currency totals.
                </p>
              </div>
              <button id="wallet-tax-settings-btn" class="mt-4 self-start text-xs font-semibold text-indigo-600 hover:underline">Configure Tax & Gateway Rules →</button>
            </div>
          </div>

          <div class="space-y-3">
            <h2 class="text-lg font-bold">Order History (${myOrders.length})</h2>
            ${
              myOrders.length === 0
                ? `<p class="text-sm text-slate-500">No orders placed yet with this account.</p>`
                : myOrders
                    .map(
                      (o) => `
                  <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p class="text-sm font-bold">${escapeHtml(o.id)} • ${o.items.map((i) => escapeHtml(i.title)).join(', ')}</p>
                      <p class="text-xs text-slate-500">${new Date(o.createdAt).toLocaleString()} • ${escapeHtml(o.paymentMethod)} • Tax: ${o.taxPercent}%</p>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="font-extrabold text-sm">${formatMoney(o.total, o.currency)}</span>
                      <button data-dl-receipt="${o.id}" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">Receipt</button>
                    </div>
                  </div>
                `
                    )
                    .join('')
            }
          </div>
        </div>
      `;

      document.getElementById('wallet-tax-settings-btn').addEventListener('click', () => {
        state.ui.view = 'settings';
        renderAll();
      });

      document.getElementById('wallet-add-btn').addEventListener('click', () => {
        openModal(
          'Add Funds to DropDeck Wallet',
          `
          <form id="add-funds-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold mb-1.5">Amount (${dispCur})</label>
              <input name="amount" type="number" min="1" step="0.01" required placeholder="50.00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Confirm Deposit</button>
          </form>
        `,
          'max-w-md'
        );
        document.getElementById('add-funds-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const amt = Number(new FormData(e.target).get('amount')) || 0;
          if (amt <= 0) return;
          acc.walletUSD = (acc.walletUSD || 0) + convertAmount(amt, dispCur, 'USD');
          saveState();
          closeModal();
          renderAll();
          showToast(`Added ${formatMoney(amt, dispCur)} to wallet.`, 'success');
        });
      });

      document.getElementById('wallet-withdraw-btn').addEventListener('click', () => {
        if (!acc.payoutHandle) {
          showToast('Please set a Payout Handle (UPI / PayPal / Bank) in Settings first.', 'error');
          return;
        }
        if ((acc.walletUSD || 0) <= 0) {
          showToast('No balance available to withdraw.', 'error');
          return;
        }
        const paidOut = formatMoney(balDisp, dispCur);
        acc.walletUSD = 0;
        saveState();
        renderAll();
        showToast(`Payout of ${paidOut} queued to ${acc.payoutHandle}.`, 'success');
      });

      container.querySelectorAll('[data-dl-receipt]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const o = state.orders.find((x) => x.id === btn.dataset.dlReceipt);
          if (!o) return;
          const text = [
            `DROPDECK OFFICIAL RECEIPT`,
            `Order ID: ${o.id}`,
            `Date: ${new Date(o.createdAt).toISOString()}`,
            `Buyer: ${o.buyerName}`,
            `Payment Method: ${o.paymentMethod}`,
            `----------------------------------------`,
            ...o.items.map((it) => `- ${it.title} (${it.category}): ${formatMoney(it.price, o.currency)}`),
            `----------------------------------------`,
            `Subtotal: ${formatMoney(o.subtotal, o.currency)}`,
            `Tax (${o.taxPercent}%): ${formatMoney(o.taxAmount, o.currency)}`,
            `Total Paid: ${formatMoney(o.total, o.currency)}`,
          ].join('\n');
          const blob = new Blob([text], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${o.id}_receipt.txt`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 3000);
        });
      });
    }

              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Default Currency (12 Supported)</label>
                <select id="set-currency" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                  ${Object.keys(CURRENCIES)
                    .map((c) => `<option value="${c}" ${s.displayCurrency === c ? 'selected' : ''}>${c} — ${CURRENCIES[c].name}</option>`)
                    .join('')}
                </select>
              </div>
              <div class="flex items-end">
                <label class="w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer">
                  <span class="text-sm font-medium">Dark Mode</span>
                  <input id="set-darkmode" type="checkbox" ${s.darkMode ? 'checked' : ''} class="rounded text-indigo-600" />
                </label>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button id="refresh-fx-btn" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">
                Refresh Live FX Rates
              </button>
              <span class="text-xs text-slate-400">Supports USD, INR, EUR, JPY, GBP, CNY, CNH, AUD, CAD, CHF, HKD, SGD</span>
            </div>
          </section>

          <section class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-bold">Tax & Zero-Tax Rules</h2>
              <label class="inline-flex items-center gap-2 text-xs font-semibold cursor-pointer">
                <input id="set-zerotax" type="checkbox" ${s.zeroTaxEnabled ? 'checked' : ''} class="rounded text-emerald-600" />
                <span>Enable 0% Tax Where Supported</span>
              </label>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Jurisdiction / Exemption Rule</label>
                <select id="set-taxrule" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                  ${TAX_JURISDICTIONS.map((r) => `<option value="${r.id}" ${s.taxRuleId === r.id ? 'selected' : ''}>${r.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Custom Tax % (when 0% mode is off)</label>
                <input id="set-customtax" type="number" min="0" max="50" step="0.1" value="${s.customTaxRate}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm" />
              </div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              ${escapeHtml((TAX_JURISDICTIONS.find((r) => r.id === s.taxRuleId) || TAX_JURISDICTIONS[0]).note)}
            </p>
          </section>

          ${
            acc
              ? `
            <section class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
              <h2 class="text-base font-bold">Active Account (${escapeHtml(acc.name)})</h2>
              <form id="acc-settings-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Account Role</label>
                  <select name="role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                    <option value="Buyer" ${acc.role === 'Buyer' ? 'selected' : ''}>Buyer Only</option>
                    <option value="Seller" ${acc.role === 'Seller' ? 'selected' : ''}>Seller Only</option>
                    <option value="User" ${acc.role === 'User' ? 'selected' : ''}>User (Buyer + Seller)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Payout Handle (UPI / PayPal / Bank)</label>
                  <input name="payoutHandle" value="${escapeHtml(acc.payoutHandle || '')}" type="text" placeholder="e.g. name@upi" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm" />
                </div>
                <div class="flex items-end">
                  <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Save Account</button>
                </div>
              </form>
            </section>
          `
              : ''
          }

          <section class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4">
            <h2 class="text-base font-bold">GitHub Pages Global Catalog & Dodo Payments</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
              Publish this file as <code>index.html</code> on GitHub Pages for free global hosting. To let visitors worldwide see your listings, export <code>catalog.json</code> below and upload it to the same GitHub repository. Attach each product's Dodo Payments checkout link (<code>https://checkout.dodopayments.com/buy/...</code>) when publishing.
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Remote Catalog JSON URL</label>
                <input id="set-catalog-url" type="text" value="${escapeHtml(s.catalogUrl || './catalog.json')}" placeholder="./catalog.json" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              </div>
              <div class="flex items-end">
                <button id="sync-catalog-btn" class="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">Sync Catalog Now</button>
              </div>
            </div>
            <div class="flex flex-wrap gap-3 pt-1">
              <button id="export-catalog-btn" class="px-4 py-2 rounded-xl bg-slate-900 dark:bg-slate-800 text-white text-xs font-semibold hover:opacity-90">Export catalog.json for GitHub</button>
              <button id="export-data-btn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">Export Full Backup JSON</button>
              <label class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">
                Import Marketplace JSON
                <input id="import-data-input" type="file" accept=".json" class="hidden" />
              </label>
              <button id="reset-all-btn" class="px-4 py-2 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-600 text-xs font-semibold hover:bg-rose-50 dark:hover:bg-rose-950/30">Reset All Data</button>
            </div>
          </section>
        </div>
      `;

      document.getElementById('set-currency').addEventListener('change', (e) => {
        state.settings.displayCurrency = e.target.value;
        saveState();
        renderAll();
      });
      document.getElementById('set-darkmode').addEventListener('change', (e) => {
        state.settings.darkMode = e.target.checked;
        applyTheme();
        saveState();
      });
      document.getElementById('set-zerotax').addEventListener('change', (e) => {
        state.settings.zeroTaxEnabled = e.target.checked;
        saveState();
        renderAll();
      });
      document.getElementById('set-taxrule').addEventListener('change', (e) => {
        state.settings.taxRuleId = e.target.value;
        saveState();
        renderAll();
      });
      document.getElementById('set-customtax').addEventListener('change', (e) => {
        state.settings.customTaxRate = Number(e.target.value) || 0;
        saveState();
        renderAll();
      });

      document.getElementById('refresh-fx-btn').addEventListener('click', async () => {
        try {
          const res = await fetch('https://open.er-api.com/v6/latest/USD');
          if (!res.ok) throw new Error('FX fetch failed');
          const data = await res.json();
          if (data && data.rates) {
            Object.keys(CURRENCIES).forEach((code) => {
              if (data.rates[code]) state.settings.customRates[code] = data.rates[code];
            });
            saveState();
            renderAll();
            showToast('Live exchange rates updated!', 'success');
          }
        } catch (err) {
          showToast('Could not reach live FX API; using built-in rates.', 'info');
        }
      });

      const accForm = document.getElementById('acc-settings-form');
      if (accForm) {
        accForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          acc.role = fd.get('role');
          acc.payoutHandle = fd.get('payoutHandle').trim();
          saveState();
          renderAll();
          showToast('Account settings updated.', 'success');
        });
      }

      document.getElementById('set-catalog-url').addEventListener('change', (e) => {
        state.settings.catalogUrl = e.target.value.trim() || './catalog.json';
        saveState();
      });

      document.getElementById('sync-catalog-btn').addEventListener('click', () => {
        syncRemoteCatalog(false);
      });

      document.getElementById('export-catalog-btn').addEventListener('click', () => {
        const publicProducts = state.products.map(({ fileId, ...rest }) => rest);
        const blob = new Blob([JSON.stringify({ products: publicProducts }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'catalog.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showToast('Exported catalog.json — upload it next to index.html on GitHub!', 'success');
      });

      document.getElementById('export-data-btn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dropdeck_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      });

      document.getElementById('import-data-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (parsed && Array.isArray(parsed.products) && Array.isArray(parsed.accounts)) {
            state = { ...structuredClone(DEFAULT_STATE), ...parsed };
            saveState();
            applyTheme();
            renderAll();
            showToast('Marketplace data imported!', 'success');
          } else {
            showToast('Invalid DropDeck backup file.', 'error');
          }
        } catch (err) {
          showToast('Failed to parse JSON file.', 'error');
        }
      });

      document.getElementById('reset-all-btn').addEventListener('click', () => {
        openModal(
          'Confirm Reset',
          `
          <p class="text-sm text-slate-600 dark:text-slate-300 mb-5">This will permanently clear all local accounts, listings, orders, and settings in DropDeck.</p>
          <div class="flex justify-end gap-3">
            <button id="cancel-reset-btn" class="px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 dark:border-slate-700">Cancel</button>
            <button id="confirm-reset-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white">Reset Everything</button>
          </div>
        `,
          'max-w-md'
        );
        document.getElementById('cancel-reset-btn').addEventListener('click', closeModal);
        document.getElementById('confirm-reset-btn').addEventListener('click', () => {
          state = structuredClone(DEFAULT_STATE);
          saveState();
          applyTheme();
          closeModal();
          renderAll();
          showToast('DropDeck has been reset.', 'info');
        });
      });
    }

    function renderNeedAccountCard(title, desc) {
      return `
        <div class="rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 p-10 text-center max-w-lg mx-auto mt-6">
          <h2 class="text-xl font-bold mb-2">${escapeHtml(title)}</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">${escapeHtml(desc)}</p>
          <button id="need-acc-btn" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Open / Sign In Account</button>
        </div>
      `;
    }

    function bindNeedAccountBtn(defaultRole) {
      const btn = document.getElementById('need-acc-btn');
      if (btn) btn.addEventListener('click', () => openAccountModal(defaultRole));
    }

    function applyTheme() {
      if (state.settings.darkMode) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }

    function populateCurrencyDropdown() {
      const sel = document.getElementById('currency-select');
      sel.innerHTML = Object.keys(CURRENCIES)
        .map((c) => `<option value="${c}" ${c === state.settings.displayCurrency ? 'selected' : ''}>${c} (${CURRENCIES[c].symbol.trim()})</option>`)
        .join('');
    }

    function renderAll() {
      populateCurrencyDropdown();
      renderTopAndSidebar();
      renderMainView();
      lucide.createIcons();
    }

    function init() {
      applyTheme();

      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const toggleSidebar = (open) => {
        if (open) {
          sidebar.classList.remove('-translate-x-full');
          backdrop.classList.remove('hidden');
        } else {
          sidebar.classList.add('-translate-x-full');
          backdrop.classList.add('hidden');
        }
      };

      document.getElementById('open-sidebar-btn').addEventListener('click', () => toggleSidebar(true));
      document.getElementById('close-sidebar-btn').addEventListener('click', () => toggleSidebar(false));
      backdrop.addEventListener('click', () => toggleSidebar(false));

      document.getElementById('brand-home-btn').addEventListener('click', () => {
        state.ui.view = 'marketplace';
        state.ui.category = 'all';
        saveState();
        renderAll();
        toggleSidebar(false);
      });

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.ui.view = btn.dataset.nav;
          if (btn.dataset.cat) state.ui.category = btn.dataset.cat;
          saveState();
          renderAll();
          toggleSidebar(false);
        });
      });

      const searchIn = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search-btn');
      searchIn.value = state.ui.search || '';
      if (searchIn.value) clearSearchBtn.classList.remove('hidden');

      searchIn.addEventListener('input', (e) => {
        state.ui.search = e.target.value;
        if (state.ui.search) clearSearchBtn.classList.remove('hidden');
        else clearSearchBtn.classList.add('hidden');
        if (state.ui.view !== 'marketplace') state.ui.view = 'marketplace';
        saveState();
        renderAll();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchIn.value = '';
        state.ui.search = '';
        clearSearchBtn.classList.add('hidden');
        saveState();
        renderAll();
      });

      document.getElementById('currency-select').addEventListener('change', (e) => {
        state.settings.displayCurrency = e.target.value;
        saveState();
        renderAll();
      });

      document.getElementById('top-publish-btn').addEventListener('click', () => openPublishModal());
      document.getElementById('cart-btn').addEventListener('click', openCartDrawer);
      document.getElementById('close-cart-btn').addEventListener('click', closeCartDrawer);
      document.getElementById('cart-drawer-backdrop').addEventListener('click', closeCartDrawer);

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-root').addEventListener('click', (e) => {
        if (e.target.id === 'modal-root') closeModal();
      });

      renderAll();
      syncRemoteCatalog(true);
    }

    async function syncRemoteCatalog(silent = true) {
      const url = (state.settings.catalogUrl || './catalog.json').trim();
      if (!url) return;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) {
          if (!silent) showToast('No catalog.json found at that URL.', 'info');
          return;
        }
        const data = await res.json();
        const remoteList = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : []);
        let added = 0;
        remoteList.forEach((rp) => {
          if (rp && rp.id && !state.products.some((lp) => lp.id === rp.id)) {
            state.products.push(rp);
            added++;
          }
        });
        if (added > 0) {
          saveState();
          renderAll();
          showToast(`Synced ${added} global listing(s) from catalog.json.`, 'success');
        } else if (!silent) {
          showToast('Catalog is already up to date.', 'info');
        }
      } catch (err) {
        if (!silent) showToast('Could not fetch remote catalog.json.', 'info');
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
